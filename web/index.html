<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Highrise</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'">
<style>
  :root {
    --panel: rgba(32, 34, 42, 0.80);
    --line: rgba(255, 255, 255, 0.09);
    --line-strong: rgba(255, 255, 255, 0.16);
    --text: rgba(255, 255, 255, 0.90);
    --dim: rgba(235, 235, 245, 0.56);
    --accent: #0a84ff;
    --good: #32d74b;
    --bad: #ff453a;
    --material: saturate(180%) blur(24px);
    --tb-h: 52px;
    --sb-h: 28px;
  }
  * { box-sizing: border-box; -webkit-user-drag: none; }
  html { color-scheme: dark; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05070f; color: var(--text); cursor: default;
    font: 13px/1.38 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased; user-select: none; }
  #c { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; cursor: crosshair; touch-action: none; }
  .panel { position: fixed; background: var(--panel); border: 0.5px solid var(--line-strong); border-radius: 12px;
    backdrop-filter: var(--material); -webkit-backdrop-filter: var(--material);
    box-shadow: 0 0 0 0.5px rgba(0,0,0,.6), 0 10px 30px rgba(0,0,0,.35); }
  button { font: inherit; color: var(--text); background: rgba(255,255,255,.07); border: 0.5px solid var(--line-strong);
    border-radius: 6px; padding: 3px 10px; cursor: default; }
  button:hover { background: rgba(255,255,255,.12); }
  button:active { background: rgba(255,255,255,.18); }
  button:focus { outline: none; }
  button:focus-visible { outline: 3px solid rgba(10,132,255,.55); outline-offset: 1px; }
  button.on { background: var(--accent); color: #fff; border-color: transparent; }
  @keyframes fadein { from { opacity: 0; } }

  /* ---------- toolbar (unified title bar) ---------- */
  #toolbar { position: fixed; top: 0; left: 0; right: 0; height: var(--tb-h); z-index: 20; display: flex; align-items: center;
    justify-content: space-between; gap: 16px; padding: 0 10px 0 16px;
    background: rgba(26,28,36,.74); backdrop-filter: var(--material); -webkit-backdrop-filter: var(--material);
    border-bottom: 0.5px solid rgba(0,0,0,.65); box-shadow: inset 0 -0.5px 0 rgba(255,255,255,.07); }
  #toolbar button, #toolbar .segmented { -webkit-app-region: no-drag; }
  body.native-mac #toolbar { padding-left: 88px; -webkit-app-region: drag; } /* frameless title bar on macOS only */
  .tb-group { display: flex; align-items: center; gap: 14px; min-width: 0; }
  .tb-title { font-weight: 700; }
  .tb-sep { width: 0.5px; height: 22px; background: var(--line-strong); }
  .stat { display: flex; align-items: center; gap: 6px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .stat svg { width: 16px; height: 16px; color: var(--dim); }
  #money.neg { color: var(--bad); }
  #stars { color: #ffd60a; letter-spacing: 1px; }
  #aclock { width: 32px; height: 32px; }
  .when { display: flex; flex-direction: column; line-height: 1.15; min-width: 92px; }
  #clock { font-weight: 600; font-variant-numeric: tabular-nums; }
  #dayl { font-size: 11px; color: var(--dim); }
  .segmented { display: flex; padding: 2px; background: rgba(255,255,255,.07); border-radius: 7px; border: 0.5px solid rgba(255,255,255,.08); }
  .segmented button { position: relative; border: 0; background: transparent; border-radius: 5px; padding: 0 10px; height: 22px; min-width: 38px;
    font-size: 12px; font-weight: 500; display: grid; place-items: center; }
  .segmented button + button::before { content: ""; position: absolute; left: 0; top: 5px; bottom: 5px; width: 0.5px; background: rgba(255,255,255,.16); }
  .segmented button.on { background: rgba(255,255,255,.26); color: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.35); }
  .segmented button.on::before, .segmented button.on + button::before { display: none; }
  .segmented svg { width: 10px; height: 10px; }
  .flow { font-size: 12px; font-variant-numeric: tabular-nums; color: var(--dim); white-space: nowrap; }
  .tbtn { position: relative; width: 32px; height: 28px; padding: 0; display: grid; place-items: center; background: transparent; border: 0; border-radius: 6px; color: var(--dim); }
  .tbtn:hover { background: rgba(255,255,255,.08); color: var(--text); }
  .tbtn.on { background: rgba(255,255,255,.17); color: var(--text); }
  .tbtn svg { width: 18px; height: 18px; }
  .badge { position: absolute; top: 1px; right: 1px; min-width: 15px; height: 15px; padding: 0 4px; border-radius: 8px; background: var(--bad);
    color: #fff; font-size: 10px; font-weight: 700; line-height: 15px; text-align: center; display: none; }
  .badge.show { display: block; }
  @media (max-width: 1240px) { .tb-title, .tb-title + .tb-sep, .flow { display: none; } }

  /* ---------- status bar ---------- */
  #statusbar { position: fixed; left: 0; right: 0; bottom: 0; height: var(--sb-h); z-index: 20; display: flex; align-items: center; gap: 10px;
    padding: 0 8px 0 14px; font-size: 11.5px; color: var(--dim); white-space: nowrap;
    background: rgba(26,28,36,.80); backdrop-filter: var(--material); -webkit-backdrop-filter: var(--material);
    border-top: 0.5px solid rgba(0,0,0,.65); box-shadow: inset 0 0.5px 0 rgba(255,255,255,.06); }
  #sb-hint { overflow: hidden; text-overflow: ellipsis; }
  #sb-hint b { color: var(--text); font-weight: 600; }
  #sb-hint .err { color: #ff6961; }
  .sb-spacer { flex: 1; }
  #sb-loc { font-variant-numeric: tabular-nums; }
  .sb-sep { width: 0.5px; height: 14px; background: var(--line-strong); }
  #statusbar button { height: 20px; min-width: 22px; padding: 0 6px; font-size: 12px; background: transparent; border: 0; color: var(--dim);
    border-radius: 4px; display: grid; place-items: center; }
  #statusbar button:hover { background: rgba(255,255,255,.1); color: var(--text); }
  #statusbar svg { width: 13px; height: 13px; }
  #zoomVal { min-width: 40px; text-align: center; font-variant-numeric: tabular-nums; }

  /* ---------- notification banners + history ---------- */
  #banners { position: fixed; top: calc(var(--tb-h) + 10px); right: 12px; width: 340px; z-index: 30; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
  .banner { pointer-events: auto; display: flex; gap: 11px; align-items: flex-start; padding: 11px 13px; border-radius: 14px;
    background: rgba(44,46,56,.82); backdrop-filter: var(--material); -webkit-backdrop-filter: var(--material);
    border: 0.5px solid rgba(255,255,255,.14); box-shadow: 0 0 0 0.5px rgba(0,0,0,.5), 0 10px 28px rgba(0,0,0,.4);
    animation: slidein .38s cubic-bezier(.2,.9,.3,1.1); }
  .banner.out { animation: slideout .28s ease forwards; }
  @keyframes slidein { from { opacity: 0; transform: translateX(34px); } }
  @keyframes slideout { to { opacity: 0; transform: translateX(34px); } }
  .bicon { flex: none; width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; background: var(--c); color: #fff;
    box-shadow: inset 0 0.5px 0 rgba(255,255,255,.35), 0 1px 2px rgba(0,0,0,.3); }
  .bicon svg { width: 18px; height: 18px; }
  .btext { flex: 1; min-width: 0; }
  .bhead { display: flex; justify-content: space-between; gap: 8px; }
  .bhead b { font-weight: 600; }
  .bhead span { font-size: 11px; color: var(--dim); }
  .bbody { font-size: 12.5px; color: rgba(235,235,245,.78); margin-top: 1px; }
  #notif-pop { top: calc(var(--tb-h) + 6px); right: 10px; width: 360px; max-height: 62vh; display: none; flex-direction: column; z-index: 31; overflow: hidden; }
  #notif-pop.show { display: flex; animation: fadein .15s; }
  .np-head { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px 10px 16px; border-bottom: 0.5px solid var(--line); font-weight: 600; }
  .np-head button { font-size: 12px; padding: 1px 9px; }
  .np-list { overflow-y: auto; padding: 6px; }
  .np-item { display: flex; gap: 10px; padding: 8px; border-radius: 8px; }
  .np-item:hover { background: rgba(255,255,255,.05); }
  .np-item .bicon { width: 26px; height: 26px; border-radius: 7px; }
  .np-item .bicon svg { width: 15px; height: 15px; }
  .np-empty { padding: 34px 20px; text-align: center; color: var(--dim); }

  /* ---------- inspector + cursor tooltip ---------- */
  #info { right: 12px; bottom: calc(var(--sb-h) + 10px); width: 264px; padding: 12px 14px; display: none; }
  #info h3 { margin: 0 0 8px; font-size: 13px; font-weight: 600; }
  #info .row { display: flex; justify-content: space-between; padding: 2px 0; color: var(--dim); font-size: 12px; }
  #info .row b { color: var(--text); font-weight: 500; }
  .bar { height: 6px; border-radius: 3px; background: rgba(255,255,255,.1); overflow: hidden; margin: 6px 0 2px; }
  .bar > i { display: block; height: 100%; }
  #tip { position: fixed; z-index: 25; pointer-events: none; padding: 3px 8px; font-size: 11.5px; border-radius: 6px; display: none; white-space: nowrap;
    background: rgba(38,40,48,.95); border: 0.5px solid rgba(255,255,255,.14); box-shadow: 0 4px 12px rgba(0,0,0,.35); }
  #tip.bad { color: #ff8a80; }

  /* ---------- sheets (settings, shortcuts) ---------- */
  #sheet-backdrop { position: fixed; inset: 0; z-index: 44; background: rgba(0,0,0,.32); display: none; }
  #sheet-backdrop.show { display: block; animation: fadein .2s; }
  .sheet { position: fixed; z-index: 45; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 440px; display: none; flex-direction: column;
    background: rgba(40,42,50,.92); backdrop-filter: var(--material); -webkit-backdrop-filter: var(--material);
    border: 0.5px solid rgba(255,255,255,.16); border-radius: 14px; box-shadow: 0 0 0 0.5px #000, 0 24px 60px rgba(0,0,0,.55); overflow: hidden; }
  .sheet.show { display: flex; animation: sheetin .22s cubic-bezier(.2,.9,.3,1.05); }
  @keyframes sheetin { from { opacity: 0; transform: translate(-50%, -48%) scale(.97); } }
  .sheet-head { padding: 16px 20px 4px; font-size: 15px; font-weight: 700; }
  .sheet-body { padding: 10px 20px 18px; display: flex; flex-direction: column; gap: 6px; max-height: 70vh; overflow-y: auto; }
  .sheet-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 16px; border-top: 0.5px solid var(--line); background: rgba(0,0,0,.14); }
  .btn-primary { background: var(--accent); color: #fff; border-color: transparent; padding: 4px 18px; font-weight: 500; }
  .btn-primary:hover { background: #2a93ff; }
  .group-label { font-size: 11px; font-weight: 600; color: var(--dim); margin: 8px 6px 2px; }
  .group { background: rgba(255,255,255,.05); border: 0.5px solid var(--line); border-radius: 10px; }
  .grow { display: flex; align-items: center; gap: 12px; padding: 8px 12px; min-height: 40px; }
  .grow + .grow { border-top: 0.5px solid var(--line); }
  .grow > span:first-child { flex: 1; }
  .grow input[type=range] { width: 170px; accent-color: var(--accent); }
  .grow output { width: 30px; text-align: right; color: var(--dim); font-variant-numeric: tabular-nums; }
  .switch { appearance: none; -webkit-appearance: none; width: 38px; height: 22px; border-radius: 11px; background: rgba(255,255,255,.2); position: relative; margin: 0; transition: background .2s; }
  .switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.4); transition: transform .2s; }
  .switch:checked { background: var(--accent); }
  .switch:checked::after { transform: translateX(16px); }
  .keys { display: grid; grid-template-columns: 1fr auto; gap: 8px 18px; font-size: 12.5px; align-items: center; }
  .keys > span:nth-child(odd) { color: var(--dim); }
  kbd.cap, .keys kbd { font: 500 11px -apple-system, system-ui, sans-serif; color: var(--text); padding: 1px 6px; border-radius: 5px; margin-left: 3px;
    background: rgba(255,255,255,.1); border: 0.5px solid rgba(255,255,255,.2); box-shadow: 0 1px 0 rgba(0,0,0,.45); }

  #tools { left: 10px; top: calc(var(--tb-h) + 10px); width: 300px; max-height: calc(100vh - var(--tb-h) - var(--sb-h) - 20px);
    display: flex; flex-direction: column; padding: 0; overflow: hidden; }
  #tools.mini { width: 62px; }
  #tools .head { display: flex; align-items: center; justify-content: space-between; padding: 11px 10px 8px 15px; }
  #tools .title { font-size: 15px; font-weight: 700; letter-spacing: .01em; }
  #tools .collapse { width: 26px; height: 26px; padding: 0; display: grid; place-items: center; border-radius: 7px; color: var(--dim); background: transparent; }
  #tools .collapse svg { width: 16px; height: 16px; transition: transform .15s; }
  #tools.mini .head { justify-content: center; padding: 10px 0 6px; }
  #tools.mini .title { display: none; }

  #tools .tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin: 0 10px; padding: 4px; border-radius: 10px; background: rgba(0,0,0,.28); }
  .tab { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 7px 4px; border: 0; border-radius: 7px; background: transparent; color: var(--dim); font-weight: 600; font-size: 12px; position: relative; }
  .tab svg { width: 16px; height: 16px; }
  .tab:hover { background: rgba(255,255,255,.06); color: var(--text); }
  .tab.on { background: rgba(255,255,255,.12); color: var(--text); box-shadow: 0 1px 0 rgba(255,255,255,.08) inset, 0 2px 6px rgba(0,0,0,.3); }
  .tab.has::after { content: ""; position: absolute; top: 5px; right: 6px; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
  #tools.mini .tabs { grid-template-columns: 1fr; margin: 0 7px; }
  #tools.mini .tab span { display: none; }

  #tools .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 10px; overflow-y: auto; }
  #tools.mini .cards, #tools.mini .ftxt { display: none; }
  .card { position: relative; display: flex; flex-direction: column; gap: 0; padding: 5px; text-align: left; border-radius: 11px;
    background: rgba(255,255,255,.04); border: 1px solid var(--line); transition: transform .08s, border-color .12s, background .12s; }
  .card:hover { background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.22); transform: translateY(-1px); }
  .card.on { border-color: var(--accent); background: rgba(10,132,255,.13); box-shadow: 0 0 0 1px var(--accent), 0 4px 14px rgba(10,132,255,.18); color: var(--text); font-weight: normal; }
  .card .thumb { height: 62px; border-radius: 7px; overflow: hidden; background: #24324a; box-shadow: inset 0 0 0 1px rgba(0,0,0,.25); }
  .card .thumb canvas { width: 100%; height: 100%; display: block; object-fit: cover; }
  .card .meta { display: flex; align-items: center; justify-content: space-between; gap: 4px; margin: 6px 2px 0; }
  .card .name { font-size: 12.5px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .sub { display: flex; justify-content: space-between; margin: 1px 2px 1px; font-size: 11px; color: var(--dim); font-variant-numeric: tabular-nums; }
  .card .price { color: #9fe3b4; font-weight: 600; }
  .card.poor .price { color: var(--bad); }
  #tools kbd { font: 600 9.5px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--dim); min-width: 16px; text-align: center;
    padding: 1px 4px; border-radius: 4px; background: rgba(255,255,255,.06); border: 1px solid var(--line); border-bottom-width: 2px; }
  .card.locked .thumb { filter: grayscale(.9) brightness(.55); }
  .card.locked .meta, .card.locked .sub { opacity: .5; }
  .card .lockbadge { position: absolute; top: 9px; left: 50%; transform: translateX(-50%); margin-top: 16px; display: none;
    font-size: 11px; font-weight: 700; color: #ffd166; background: rgba(20,16,0,.75); padding: 2px 8px; border-radius: 10px; border: 1px solid rgba(255,209,102,.4); white-space: nowrap; }
  .card.locked .lockbadge { display: block; }
  .qa .lockbadge { display: none; }

  #tools .quick { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 0 10px 10px; }
  .qa { display: flex; align-items: center; gap: 7px; padding: 7px 9px; border-radius: 9px; font-weight: 600; font-size: 12.5px;
    background: rgba(255,255,255,.04); }
  .qa svg { width: 16px; height: 16px; color: var(--c); flex: none; }
  .qa kbd { margin-left: auto; }
  .qa.on { background: color-mix(in srgb, var(--c) 22%, transparent); border-color: var(--c); color: var(--text); font-weight: 600; }
  #tools.mini .quick { grid-template-columns: 1fr; padding: 8px 7px; }
  #tools.mini .qa { justify-content: center; padding: 8px 0; }
  #tools.mini .qa span, #tools.mini .qa kbd { display: none; }

  #tools .foot { border-top: 1px solid var(--line); padding: 9px 14px 11px; font-size: 11px; color: var(--dim); }
  #tools .ftxt { display: flex; justify-content: space-between; font-variant-numeric: tabular-nums; }
  #tools .foot .bar { margin: 6px 0 0; height: 5px; }
  #tools .foot .bar i { background: linear-gradient(90deg, #ffd166, #ffb347); transition: width .4s; }
  #tools .foot b { color: #ffd166; font-weight: 600; letter-spacing: 1px; }
  #tools.mini .foot { padding: 8px 9px; }

  #toolcard { position: fixed; z-index: 10; width: 250px; padding: 11px 13px; pointer-events: none; display: none; }
  #toolcard h4 { margin: 0 0 2px; font-size: 14px; display: flex; align-items: center; gap: 8px; }
  #toolcard h4 kbd { font: 600 10px ui-monospace, monospace; color: var(--dim); padding: 1px 5px; border-radius: 4px; border: 1px solid var(--line); margin-left: auto; }
  #toolcard p { margin: 0 0 8px; color: var(--dim); font-size: 12px; }
  #toolcard .row { display: flex; justify-content: space-between; gap: 10px; font-size: 12px; padding: 2px 0; color: var(--dim); }
  #toolcard .row b { color: var(--text); font-weight: 600; text-align: right; }
  #toolcard .note { margin-top: 8px; padding: 5px 8px; border-radius: 6px; font-size: 11.5px; }
  #toolcard .note.lock { background: rgba(255,209,102,.12); color: #ffd166; }
  #toolcard .note.poor { background: rgba(255,107,107,.12); color: #ff9b9b; }
  #toolcard .note.tip { background: rgba(10,132,255,.10); color: #9fd8ff; }

  /* ---------- splash ---------- */
  #splash { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; cursor: pointer;
    background: radial-gradient(ellipse at 50% 120%, #2a2350 0%, #0b1020 55%, #05070f 100%); transition: opacity .7s ease; }
  #splash.gone { opacity: 0; pointer-events: none; }
  .splash-inner { display: flex; flex-direction: column; align-items: center; gap: 22px; }
  .skyline { display: flex; align-items: flex-end; gap: 6px; height: 150px; }
  .skyline i { width: 26px; border-radius: 3px 3px 0 0; transform-origin: bottom; animation: rise 1.1s cubic-bezier(.2,.9,.25,1.15) both;
    background: linear-gradient(180deg, #5ec2ff, #3b6fd1); position: relative; overflow: hidden; }
  .skyline i::after { content: ""; position: absolute; inset: 6px 5px; background: repeating-linear-gradient(180deg, rgba(255,226,140,.85) 0 3px, transparent 3px 9px);
    -webkit-mask: repeating-linear-gradient(90deg, #000 0 5px, transparent 5px 8px); mask: repeating-linear-gradient(90deg, #000 0 5px, transparent 5px 8px); opacity: .8; }
  .skyline i.tall { background: linear-gradient(180deg, #ffd166, #f29e4c); }
  @keyframes rise { from { transform: scaleY(0); } to { transform: scaleY(1); } }
  .logo { font: 800 64px/1 ui-sans-serif, system-ui, -apple-system, sans-serif; letter-spacing: .22em; margin-right: -.22em;
    background: linear-gradient(180deg, #ffffff, #a9c7ff); -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: fadeup .9s .5s both; }
  .tagline { color: var(--dim); font-size: 15px; letter-spacing: .04em; animation: fadeup .9s .8s both; }
  .press { margin-top: 26px; font-size: 13px; letter-spacing: .25em; text-transform: uppercase; color: #cfe3ff; animation: fadeup .6s 1.3s both, pulse 1.8s 2s infinite; }
  @keyframes fadeup { from { opacity: 0; transform: translateY(10px); } }
  @keyframes pulse { 50% { opacity: .35; } }

  /* ---------- title / pause menu ---------- */
  #menu-screen { position: fixed; inset: 0; z-index: 40; display: none;
    background: linear-gradient(90deg, rgba(5,7,16,.94) 0%, rgba(5,7,16,.74) 36%, rgba(5,7,16,.12) 70%, rgba(5,7,16,0) 100%); }
  #menu-screen.show { display: block; animation: fadein .35s; }
  .menu-col { position: absolute; left: clamp(40px, 9vw, 140px); top: 50%; transform: translateY(-50%); width: 380px; display: flex; flex-direction: column; }
  .menu-col .logo { font-size: 52px; animation: none; margin: 0 0 6px 2px; }
  .menu-col .tagline { animation: none; margin: 0 0 34px 4px; font-size: 13px; }
  #menu-buttons { display: flex; flex-direction: column; gap: 2px; }
  .titem { position: relative; display: flex; align-items: baseline; gap: 12px; width: 100%; padding: 9px 14px 9px 20px; text-align: left;
    background: transparent; border: 0; border-radius: 8px; font-size: 21px; font-weight: 500; color: rgba(255,255,255,.74); letter-spacing: .01em; }
  .titem small { font-size: 12.5px; font-weight: 400; color: var(--dim); }
  .titem::before { content: ""; position: absolute; left: 6px; top: 50%; width: 3px; height: 0; border-radius: 2px; background: var(--accent); transform: translateY(-50%); transition: height .15s; }
  .titem:hover, .titem.primary { color: #fff; background: linear-gradient(90deg, rgba(10,132,255,.24), rgba(10,132,255,0) 85%); }
  .titem:hover::before, .titem.primary::before { height: 58%; }
  #menu-buttons:hover .titem.primary:not(:hover) { color: rgba(255,255,255,.74); background: transparent; }
  #menu-buttons:hover .titem.primary:not(:hover)::before { height: 0; }
  .titem.warn, .titem.warn small { color: #ff8a80; }
  .menu-foot { margin: 34px 0 0 20px; font-size: 11px; color: rgba(235,235,245,.38); }

  #menu-screen.pause { background: rgba(0,0,0,.34); backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px); }
  #menu-screen.pause .menu-col { left: 50%; transform: translate(-50%, -50%); width: 300px; padding: 14px 6px 6px; border-radius: 14px;
    background: rgba(40,42,50,.9); backdrop-filter: var(--material); -webkit-backdrop-filter: var(--material);
    border: 0.5px solid rgba(255,255,255,.16); box-shadow: 0 0 0 0.5px #000, 0 24px 60px rgba(0,0,0,.55); }
  #menu-screen.pause .logo { font-size: 15px; letter-spacing: .32em; text-align: center; margin: 2px 0 2px; }
  #menu-screen.pause .tagline { font-size: 11px; text-align: center; margin: 0 0 10px; }
  #menu-screen.pause .menu-foot { margin: 6px 0 4px; text-align: center; }
  .mrow { display: flex; align-items: center; gap: 10px; width: 100%; padding: 6px 10px; text-align: left; background: transparent; border: 0; border-radius: 6px; font-size: 13.5px; }
  .mrow svg { width: 16px; height: 16px; color: var(--dim); flex: none; }
  .mrow kbd { margin-left: auto; font: 12px -apple-system, system-ui, sans-serif; color: var(--dim); }
  .mrow:hover { background: var(--accent); color: #fff; }
  .mrow:hover svg, .mrow:hover kbd { color: rgba(255,255,255,.85); }
  .mrow.warn { color: #ff8a80; }
  .mrow.warn:hover { background: var(--bad); color: #fff; }
  .msep { height: 0.5px; background: var(--line-strong); margin: 5px 10px; }

  body.on-title #toolbar, body.on-title #statusbar, body.on-title #tools, body.on-title #info, body.on-title #tip,
  body.on-title #toolcard, body.on-title #banners, body.on-title #notif-pop { display: none !important; }
  /* ---------- handbook ---------- */
  #handbook { width: min(940px, 94vw); height: min(660px, 90vh); }
  .hb { display: flex; flex: 1; min-height: 0; }
  .hb-side { width: 210px; flex: none; display: flex; flex-direction: column; border-right: 0.5px solid var(--line); background: rgba(0,0,0,.14); }
  .hb-search { margin: 12px 10px 6px; padding: 5px 9px; border-radius: 7px; border: 0.5px solid var(--line-strong); background: rgba(0,0,0,.25);
    color: var(--text); font: inherit; outline: none; user-select: text; }
  .hb-search:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(10,132,255,.3); }
  .hb-nav { overflow-y: auto; padding: 0 6px 10px; }
  .hb-nav .group-label { margin: 10px 8px 3px; }
  .hb-nav button { display: block; width: 100%; text-align: left; background: transparent; border: 0; padding: 5px 10px; border-radius: 6px; color: var(--text); }
  .hb-nav button.on { background: var(--accent); color: #fff; }
  .hb-nav .hb-empty { padding: 14px 10px; color: var(--dim); font-size: 12px; }
  .hb-main { flex: 1; min-width: 0; overflow-y: auto; padding: 18px 26px 26px; user-select: text; font-size: 13.5px; line-height: 1.55; }
  .hb-main h2 { margin: 0 0 12px; font-size: 22px; }
  .hb-main h3 { margin: 20px 0 6px; font-size: 14px; }
  .hb-main p { margin: 0 0 10px; color: rgba(235,235,245,.84); }
  .hb-main ul, .hb-main ol { margin: 0 0 10px; padding-left: 20px; color: rgba(235,235,245,.84); }
  .hb-main li { margin: 3px 0; }
  .hb-main a { color: #64b5ff; cursor: pointer; }
  .hb-main a:hover { text-decoration: underline; }
  .hb-main code { font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; background: rgba(255,255,255,.08); padding: 1px 5px; border-radius: 4px; }
  .hb-main .good { color: var(--good); } .hb-main .bad { color: #ff6b6b; }
  .hb-lead { font-size: 14.5px; color: var(--text) !important; }
  .hb-steps li { margin: 8px 0; }
  .hb-pic { float: right; margin: 0 0 12px 18px; width: 264px; height: 124px; border-radius: 10px; overflow: hidden; box-shadow: inset 0 0 0 1px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.35); }
  .hb-pic canvas { width: 100%; height: 100%; display: block; }
  .hb-kv { border-collapse: collapse; margin: 0 0 12px; min-width: 300px; }
  .hb-kv td { padding: 4px 14px 4px 0; border-bottom: 0.5px solid var(--line); }
  .hb-kv td:first-child { color: var(--dim); }
  .hb-kv td:last-child { font-weight: 600; }
  .hb-tbl { border-collapse: collapse; width: 100%; margin: 4px 0 12px; font-size: 12.5px; clear: both; }
  .hb-tbl th { text-align: left; font-size: 11px; font-weight: 600; color: var(--dim); padding: 4px 10px 6px 0; border-bottom: 0.5px solid var(--line-strong); }
  .hb-tbl td { padding: 6px 10px 6px 0; border-bottom: 0.5px solid var(--line); vertical-align: top; }
  .hb-note { clear: both; margin: 12px 0; padding: 9px 12px; border-radius: 8px; font-size: 12.5px; }
  .hb-note.tip { background: rgba(10,132,255,.12); color: #b4dcff; }
  .hb-note.warn { background: rgba(255,69,58,.12); color: #ffb0aa; }
  .hb-ach { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .hb-ach > div { padding: 9px 12px; border-radius: 9px; background: rgba(255,255,255,.04); border: 0.5px solid var(--line); opacity: .6; }
  .hb-ach > div.done { opacity: 1; border-color: rgba(191,90,242,.5); background: rgba(191,90,242,.1); }
  .hb-ach b { display: block; } .hb-ach span { font-size: 12px; color: var(--dim); }
  kbd.pad { background: rgba(10,132,255,.18); border-color: rgba(10,132,255,.45); }
  .hb-main kbd { font: 500 11px -apple-system, system-ui, sans-serif; padding: 1px 6px; border-radius: 5px;
    background: rgba(255,255,255,.1); border: 0.5px solid rgba(255,255,255,.2); box-shadow: 0 1px 0 rgba(0,0,0,.45); white-space: nowrap; }
  .hb-foot-hint { margin-right: auto; align-self: center; font-size: 11.5px; color: var(--dim); }

  /* ---------- gamepad cursor ---------- */
  #padcursor { position: fixed; z-index: 100; left: 0; top: 0; width: 26px; height: 26px; pointer-events: none; display: none; }
  body.pad #padcursor { display: block; }
  body.pad, body.pad #c { cursor: none; }
  .pad-focus { outline: 2px solid var(--accent) !important; outline-offset: 1px; }

  body.native-mac #menu-screen::before, body.native-mac #splash::before { content: ""; position: fixed; top: 0; left: 0; right: 0; height: 28px; -webkit-app-region: drag; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<header id="toolbar">
  <div class="tb-group">
    <span class="tb-title">Highrise</span><span class="tb-sep"></span>
    <span class="stat" title="Funds"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5H18v3"/><rect x="3" y="7.5" width="18" height="12" rx="2.5"/><circle cx="16.5" cy="13.5" r="1.2" fill="currentColor"/></svg><span id="money">$0</span></span>
    <span class="stat" title="Population"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.6-3.2 2.8-5 5.5-5s4.9 1.8 5.5 5"/><circle cx="17" cy="9" r="2.4"/><path d="M16 14.2c2.4-.3 4.1 1.3 4.6 4.3"/></svg><span id="pop">0</span></span>
    <span class="stat" title="Tower rating"><span id="stars">★☆☆☆☆</span></span>
  </div>
  <div class="tb-group">
    <canvas id="aclock" width="64" height="64"></canvas>
    <div class="when"><span id="clock">6:00 AM</span><span id="dayl">Mon · Day 1</span></div>
    <div class="segmented" id="speeds" title="Game speed (P pauses)"></div>
  </div>
  <div class="tb-group" style="gap:4px">
    <span class="flow" id="flow" title="Yesterday: income / expenses" style="margin-right:10px">—</span>
    <button class="tbtn" id="evalBtn" title="Evaluation overlay (E)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M21 20H3"/></svg></button>
    <button class="tbtn" id="notifBtn" title="Notifications"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></svg><span class="badge" id="notifBadge"></span></button>
    <button class="tbtn" id="muteBtn" title="Mute (M)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg></button>
    <button class="tbtn" id="handbookBtn" title="Handbook (F1)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H11v16H5.5A1.5 1.5 0 0 1 4 18.5z"/><path d="M20 5.5A1.5 1.5 0 0 0 18.5 4H13v16h5.5a1.5 1.5 0 0 0 1.5-1.5z"/></svg></button>
    <button class="tbtn" id="menuBtn" title="Menu (Esc)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  </div>
</header>

<div id="tools" class="panel"></div>
<div id="toolcard" class="panel"></div>
<div id="info" class="panel"></div>
<div id="banners"></div>
<div id="notif-pop" class="panel">
  <div class="np-head"><span>Notifications</span><button id="notifClear">Clear</button></div>
  <div class="np-list" id="notifList"></div>
</div>

<footer id="statusbar">
  <span id="sb-hint"></span>
  <span class="sb-spacer"></span>
  <span id="sb-loc"></span>
  <span class="sb-sep"></span>
  <button id="zoomOut" title="Zoom out">−</button><span id="zoomVal">100%</span><button id="zoomIn" title="Zoom in">+</button>
  <button id="fitBtn" title="Recenter on tower (C)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
  <span class="sb-sep"></span>
  <button id="helpBtn" title="Controls (?)">?</button>
</footer>
<div id="tip"></div>
<svg id="padcursor" viewBox="0 0 26 26"><path d="M3 2l18 9.5-7.6 1.8L10 21z" fill="#fff" stroke="#0a1020" stroke-width="1.6" stroke-linejoin="round"/></svg>

<div id="sheet-backdrop"></div>
<div id="settings-sheet" class="sheet">
  <div class="sheet-head">Settings</div>
  <div class="sheet-body">
    <div class="group-label">Sound</div>
    <div class="group">
      <label class="grow"><span>Music</span><input type="range" id="volMusic" min="0" max="1" step="0.05"><output id="volMusicOut"></output></label>
      <label class="grow"><span>Sound effects</span><input type="range" id="volSfx" min="0" max="1" step="0.05"><output id="volSfxOut"></output></label>
      <label class="grow"><span>Mute all sound</span><input type="checkbox" class="switch" id="muteSwitch"></label>
    </div>
    <div class="group-label">Display</div>
    <div class="group">
      <div class="grow"><span>Full screen</span><button id="fsBtn">Toggle</button></div>
      <label class="grow"><span>Evaluation overlay</span><input type="checkbox" class="switch" id="evalSwitch"></label>
    </div>
  </div>
  <div class="sheet-foot"><button class="btn-primary" data-close>Done</button></div>
</div>
<div id="handbook" class="sheet">
  <div class="hb">
    <nav class="hb-side"><input class="hb-search" id="hbSearch" type="search" placeholder="Search the Handbook" spellcheck="false"><div class="hb-nav" id="hbNav"></div></nav>
    <article class="hb-main" id="hbMain"></article>
  </div>
  <div class="sheet-foot"><span class="hb-foot-hint" id="hbHint"></span><button id="hbPrev">‹ Previous</button><button id="hbNext">Next ›</button><button class="btn-primary" data-close>Done</button></div>
</div>

<div id="menu-screen">
  <div class="menu-col">
    <div class="logo">HIGHRISE</div>
    <div class="tagline">Build it up. Fill it up. Keep the elevators moving.</div>
    <div id="menu-buttons"></div>
    <div class="menu-foot" id="menu-foot"></div>
  </div>
</div>

<div id="splash">
  <div class="splash-inner">
    <div class="skyline">
      <i style="height:46%;animation-delay:.05s"></i><i style="height:70%;animation-delay:.15s"></i>
      <i class="tall" style="height:100%;animation-delay:.25s"></i><i style="height:82%;animation-delay:.35s"></i>
      <i style="height:58%;animation-delay:.45s"></i><i style="height:36%;animation-delay:.55s"></i>
    </div>
    <div class="logo">HIGHRISE</div>
    <div class="tagline">A tower-building sim</div>
    <div class="press">Click or press any key</div>
  </div>
</div>

<script type="module" src="main.js"></script>
</body>
</html>
